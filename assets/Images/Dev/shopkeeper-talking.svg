<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
<title id="title">STARFALL Demon Shopkeeper</title><desc id="desc">A much larger, frightening dragon-like form of the STARFALL Nekodragon shopkeeper, wingless and wearing a torn white shirt, black vest and black tie.</desc>
<defs>
 <linearGradient id="dfur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9c79ff"/><stop offset=".4" stop-color="#4c3a9b"/><stop offset="1" stop-color="#160f35"/></linearGradient>
 <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#21182f"/><stop offset="1" stop-color="#050309"/></linearGradient>
 <radialGradient id="eye"><stop stop-color="#ff9b18"/><stop offset=".42" stop-color="#ff5a00"/><stop offset=".78" stop-color="#d31800"/><stop offset="1" stop-color="#ff7b00"/></radialGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#000" flood-opacity=".75"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>.ink{stroke:#0b0718;stroke-width:12;stroke-linejoin:round;stroke-linecap:round}.scar{stroke:#ff5a9d;stroke-width:7;fill:none;opacity:.72}.tear{fill:#0b0711;stroke:#0b0718;stroke-width:6}</style>
</defs>
