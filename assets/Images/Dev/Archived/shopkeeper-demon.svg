<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 980" role="img" aria-labelledby="title desc">
<title id="title">STARFALL Nekodragon Shopkeeper</title><desc id="desc">Detailed wingless blurple Nekodragon shopkeeper wearing a white dress shirt, black tie and black vest.</desc>
<defs>
 <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9187ff"/><stop offset=".45" stop-color="#5e55c8"/><stop offset="1" stop-color="#28245e"/></linearGradient>
 <linearGradient id="furDark" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5148a8"/><stop offset="1" stop-color="#201c4d"/></linearGradient>
 <linearGradient id="vest" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#24233b"/><stop offset="1" stop-color="#090912"/></linearGradient>
 <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#d9d7e4"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
